[package]
name = "quota-service"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared native service for QuotaBar"
license = "MIT"

[lib]
name = "quota_service"
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
libc = "0.2.177"
num-bigint = "0.4.6"
num-traits = "0.2.19"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }

# macOS speaks TLS through Secure Transport: edge firewalls that fingerprint rustls handshakes
# (cursor.com on Vercel) refuse them with a 403 page. See `HttpClient::with_timeout`.
[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "native-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
