name: Quota
options:
  bundleIdPrefix: io.gotry
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  QuotaAppleClient:
    path: ../../packages/apple-client
  QuotaAppleShared:
    path: ../../packages/apple-shared
targets:
  Quota:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Quota.entitlements
      - path: Resources
      - path: WidgetSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gotry.quota
        PRODUCT_NAME: Quota
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/Quota.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: QuotaAppleClient
        product: QuotaWire
      - package: QuotaAppleClient
        product: QuotaRelay
      - package: QuotaAppleClient
        product: QuotaAccount
      - package: QuotaAppleClient
        product: QuotaWidgetData
      - package: QuotaAppleShared
        product: QuotaPresentation
      - sdk: BackgroundTasks.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - target: QuotaWidgets
        embed: true
    scheme:
      testTargets:
        - QuotaTests
        - QuotaUITests
  QuotaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - QuotaWidgets.entitlements
      - path: WidgetSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gotry.quota.widgets
        PRODUCT_NAME: QuotaWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/QuotaWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
    dependencies:
      - package: QuotaAppleClient
        product: QuotaWidgetData
      - package: QuotaAppleShared
        product: QuotaPresentation
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
  QuotaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gotry.quota.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quota.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Quota"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Quota
      - package: QuotaAppleClient
        product: QuotaWire
      - package: QuotaAppleClient
        product: QuotaRelay
      - package: QuotaAppleClient
        product: QuotaAccount
      - package: QuotaAppleClient
        product: QuotaWidgetData
      - package: QuotaAppleShared
        product: QuotaPresentation
  QuotaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.gotry.quota.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Quota
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Quota
