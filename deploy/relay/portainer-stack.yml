# quota-relay on dmit. Secrets are Portainer stack Env vars (env_file is not
# usable in Portainer stacks). Public traffic: Caddy (stack 87) -> relay:8787.
services:
  relay:
    image: ghcr.io/gotry-io/quota-relay:0.0.9
    container_name: quota-relay
    restart: unless-stopped
    environment:
      PORT: "8787"
      RELAY_SQLITE_PATH: /data/relay.sqlite
      RELAY_STATIC_DIR: apps/web/.svelte-kit/output/client
      NODE_OPTIONS: --max-old-space-size=64
      # Behind Cloudflare the client exists only as CF-Connecting-IP; Relay reads it
      # from Caddy (a private-range peer) and ignores X-Forwarded-For. The origin is
      # reachable directly, so the header is forgeable there — accepted, since it only
      # keys per-address rate limits (docs/relay-self-host.md, Topology).
      RELAY_CLIENT_ADDRESS_HEADER: cf-connecting-ip
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      APPLE_SIGNIN_TEAM_ID: ${APPLE_SIGNIN_TEAM_ID}
      APPLE_SIGNIN_SERVICES_ID: ${APPLE_SIGNIN_SERVICES_ID}
      APPLE_SIGNIN_KEY_ID: ${APPLE_SIGNIN_KEY_ID}
      APPLE_SIGNIN_PRIVATE_KEY: ${APPLE_SIGNIN_PRIVATE_KEY}
      IDENTITY_SUBJECT_KEY: ${IDENTITY_SUBJECT_KEY}
      QUOTA_INSTALLATION_KEY: ${QUOTA_INSTALLATION_KEY}
      QUOTA_SESSION_HASH_KEY: ${QUOTA_SESSION_HASH_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    volumes:
      - relay-data:/data
    networks:
      - web
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    image: alpine:3.21
    container_name: quota-relay-backup
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RELAY_SQLITE_PATH: /data/relay.sqlite
      RELAY_BACKUP_DIR: /backups
      RELAY_BACKUP_KEEP: "14"
    volumes:
      - relay-data:/data
      - relay-backups:/backups
      - /opt/quota-relay/relay-sqlite-backup.sh:/usr/local/bin/relay-sqlite-backup.sh:ro
    mem_limit: 32m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache sqlite tzdata
        exec /usr/local/bin/relay-sqlite-backup.sh --loop

networks:
  web:
    external: true

volumes:
  relay-data:
  relay-backups:
