name: release-menubar

# A menubar-v* tag builds one Apple Silicon artifact, signs and notarizes it, and publishes a GitHub Release.
# Stable tags also push the generated Cask to gotry-io/homebrew-tap.
# Prerelease tags (menubar-v0.0.2-beta.1) create a GitHub prerelease only and skip Homebrew.
# A manual run may only republish an existing tag; it never builds an untagged main commit.
# The bundled private Rust service follows the QuotaBar release version.
on:
  push:
    tags: ["menubar-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing QuotaBar semver to re-publish (e.g. 0.0.4), without menubar-v prefix"
        required: true

permissions:
  contents: write

concurrency:
  group: quotabar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('menubar-v{0}', github.event.inputs.version) || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" == menubar-v* ]]; then
            VERSION="${REF_NAME#menubar-v}"
          else
            echo "expected tag menubar-v*, got: $REF_NAME" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          # Prerelease versions use a hyphen suffix (semver), e.g. 0.0.2-beta.1.
          # Only stable releases update the Homebrew Cask.
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL=beta
            PRERELEASE=true
          else
            CHANNEL=stable
            PRERELEASE=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=menubar-v$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Validate product version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(plutil -extract CFBundleShortVersionString raw apps/menubar/Support/Info.plist)"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "menubar-v${VERSION} does not match QuotaBar's Info.plist (${SOURCE_VERSION})" >&2
            echo "bump and commit the QuotaBar version before creating the release tag" >&2
            exit 1
          fi

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          test "$(uname -m)" = arm64
          node --version
          pnpm --version
          cargo --version
          swift --version

      - name: Install and verify
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm check
          pnpm test

      - name: Package arm64 app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Packaging QuotaBar ${VERSION} with its private Rust service"
          ./scripts/package-menubar.sh "$VERSION" "${{ github.run_number }}"
          pnpm test:menubar:helper

      - name: Import Developer ID identity
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          P12_PATH="$RUNNER_TEMP/quotabar-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/quotabar-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$P12_BASE64" | base64 -D > "$P12_PATH"
          chmod 600 "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
            grep -q 'Developer ID Application: DONG HAO (86Y537ZF24)'

      - name: Sign QuotaBar
        env:
          SIGNING_IDENTITY: "Developer ID Application: DONG HAO (86Y537ZF24)"
        run: |
          set -euo pipefail
          APP="dist/menubar/QuotaBar.app"
          test "$(lipo -archs "$APP/Contents/MacOS/QuotaBar")" = arm64
          test "$(lipo -archs "$APP/Contents/Helpers/quota-service")" = arm64
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
            "$APP/Contents/Helpers/quota-service"
          codesign --verify --strict --verbose=2 "$APP/Contents/Helpers/quota-service"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --verbose=4 "$APP" 2>&1 | grep -q 'TeamIdentifier=86Y537ZF24'

      - name: Notarize and staple
        id: artifact
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$NOTARY_KEY_BASE64"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
          APP="dist/menubar/QuotaBar.app"
          RELEASE_DIR="dist/release"
          ARCHIVE="QuotaBar-${VERSION}-macos-arm64.zip"
          mkdir -p "$RELEASE_DIR"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RELEASE_DIR/$ARCHIVE"
          xcrun notarytool submit "$RELEASE_DIR/$ARCHIVE" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          rm "$RELEASE_DIR/$ARCHIVE"
          ditto -c -k --keepParent "$APP" "$RELEASE_DIR/$ARCHIVE"
          SHA256="$(shasum -a 256 "$RELEASE_DIR/$ARCHIVE" | cut -d' ' -f1)"
          printf '%s  %s\n' "$SHA256" "$ARCHIVE" > "$RELEASE_DIR/$ARCHIVE.sha256"
          DMG="QuotaBar-${VERSION}-macos-arm64.dmg"
          LATEST_DMG="QuotaBar-macos-arm64.dmg"
          chmod +x ./scripts/package-menubar-dmg.sh
          ./scripts/package-menubar-dmg.sh "$VERSION" "$APP" "$RELEASE_DIR/$DMG"
          cp "$RELEASE_DIR/$DMG" "$RELEASE_DIR/$LATEST_DMG"
          DMG_SHA256="$(shasum -a 256 "$RELEASE_DIR/$DMG" | cut -d' ' -f1)"
          printf '%s  %s\n' "$DMG_SHA256" "$DMG" > "$RELEASE_DIR/$DMG.sha256"
          python3 - <<PY
          import json
          feed = {
            "schema_version": 1,
            "product": "quotabar",
            "version": "${VERSION}",
            "notes": "QuotaBar ${VERSION}",
            "assets": {
              "dmg": {
                "url": "https://github.com/gotry-io/Quota/releases/download/menubar-v${VERSION}/${LATEST_DMG}",
                "sha256": "${DMG_SHA256}",
              },
              "zip": {
                "url": "https://github.com/gotry-io/Quota/releases/download/menubar-v${VERSION}/${ARCHIVE}",
                "sha256": "${SHA256}",
              },
            },
          }
          with open("${RELEASE_DIR}/menubar-update.json", "w", encoding="utf-8") as handle:
              json.dump(feed, handle, indent=2)
              handle.write("\\n")
          PY
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "latest_dmg=$LATEST_DMG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            CREATE_ARGS=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            echo "Creating GitHub release channel=${CHANNEL} prerelease=${PRERELEASE}"
            gh release create "$TAG" "${CREATE_ARGS[@]}"
          fi
          gh release upload "$TAG" \
            "dist/release/$ARCHIVE" \
            "dist/release/$ARCHIVE.sha256" \
            "dist/release/${{ steps.artifact.outputs.dmg }}" \
            "dist/release/${{ steps.artifact.outputs.dmg }}.sha256" \
            "dist/release/${{ steps.artifact.outputs.latest_dmg }}" \
            "dist/release/menubar-update.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish Homebrew Cask
        if: steps.version.outputs.prerelease != 'true'
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "$TAP_PUSH_TOKEN"
          ARCHIVE="QuotaBar-${VERSION}-macos-arm64.zip"
          URL="https://github.com/gotry-io/Quota/releases/download/menubar-v${VERSION}/${ARCHIVE}"
          git clone --depth 1 \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/gotry-io/homebrew-tap.git" \
            "$RUNNER_TEMP/homebrew-tap"
          ./scripts/render-homebrew-cask.sh \
            "$VERSION" "$SHA256" "$URL" "$RUNNER_TEMP/homebrew-tap/Casks/quotabar.rb"
          cd "$RUNNER_TEMP/homebrew-tap"
          git add -A
          if git diff --cached --quiet; then
            echo "QuotaBar Cask is already at ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "quotabar ${VERSION}"
          # Preserve any tap changes that landed while this release was running.
          git pull --rebase origin main
          git push

      - name: Skip Homebrew Cask for prerelease
        if: steps.version.outputs.prerelease == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Skipping Homebrew Cask update for prerelease ${VERSION}"
          echo "Install the signed ZIP from the GitHub prerelease instead."
