name: deploy-cloudflare

# Deploys the Worker `quota` over D1. Since 2026-09-14 production is the Node/SQLite Relay on
# dmit (docs/relay-self-host.md); the Worker is the rollback path. `wrangler deploy` re-creates the
# quota.gotry.io custom domain from wrangler.jsonc, which takes precedence over the A record at the
# edge, so this workflow is manual: running it IS the rollback to the Worker and D1.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   Token with Workers Scripts Edit + D1 Edit on the production account
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id that owns the `quota` Worker/D1 database
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing secret CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify relay and web
        run: |
          set -euo pipefail
          pnpm --filter @gotry-io/quota-web check
          pnpm --filter @gotry-io/quota-web test
          pnpm --filter @gotry-io/quota-web build
          pnpm --filter @gotry-io/quota-relay check
          pnpm --filter @gotry-io/quota-relay test
          pnpm --filter @gotry-io/quota-relay build:cloudflare

      - name: Apply remote D1 migrations
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm d1:migrate:remote

      - name: Deploy Worker and website
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # deploy:cloudflare rebuilds apps/web then wrangler deploy (API + Static Assets together).
        run: pnpm deploy:cloudflare
