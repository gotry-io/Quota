<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f8f5" />
    <script nonce="%sveltekit.nonce%">
      (() => {
        const stored = localStorage.getItem("quota-theme");
        const explicitTheme = stored === "light" || stored === "dark" ? stored : null;
        const theme =
          explicitTheme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (explicitTheme) document.documentElement.dataset.theme = explicitTheme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#111111" : "#f2f8f5",
        );
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://quota.gotry.io/og.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <a class="skip-link" href="#main">Skip to content</a>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
