name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run on a PR branch is cancelled as soon as the next push starts.
# main never cancels: every commit on it keeps a complete, attributable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # TypeScript, the provider catalog, and Biome formatting need no macOS toolchain, so they
  # run here and leave `verify` carrying only Swift and macOS-gated Rust.
  # `verify` remains the required macOS check name; keep this job required too.
  verify-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript workspace
        run: |
          set -euo pipefail
          pnpm format:check:js
          pnpm check:provider-catalog
          pnpm check:schema
          pnpm -r --if-present check
          pnpm -r --if-present test

      - name: Build the Relay Worker and website
        run: pnpm --filter @gotry-io/quota-relay build

  verify-web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @gotry-io/quota-web exec playwright install --with-deps chromium

      - name: Run website end-to-end tests
        run: pnpm --filter @gotry-io/quota-web test:e2e

  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Only main writes the cache. Feature branches restore from it but never save, which
      # keeps a busy PR queue from evicting main's entry out of the 10 GB repository limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # quota-service carries `cfg(target_os = "macos")` branches in relay and the Claude
      # provider, so these tests cannot move to a Linux runner.
      # This job runs the root `test` script's Rust and Swift halves without pnpm, because it
      # installs no node. `cargo test` supersedes the `cargo check --all-targets` that root
      # `check` runs first, and the packaging step below links QuotaBar in release, so neither
      # belongs here. rustfmt covers the whole workspace and this is the only Rust runner.
      - name: Verify Rust and Swift
        run: |
          set -euo pipefail
          swift --version
          cargo fmt --all -- --check
          cargo test --locked --package quota-service --package quota-menubar-helper
          ./scripts/test-swift.sh

      - name: Package unsigned arm64 app
        run: ./scripts/package-menubar.sh 0.0.1 "${{ github.run_number }}"

      - name: Test packaged helper with isolated local state
        run: ./scripts/test-menubar-helper.sh

  # iOS generate/build/test. Advisory: not a required check. The Xcode steps run
  # only when the pull request or push touches iOS-related paths.
  verify-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect iOS-related path changes
        id: ios
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          pattern='^(apps/ios(/|$)|packages/apple-client(/|$)|packages/apple-shared(/|$)|scripts/[^/]*ios[^/]*$|\.github/workflows/ci\.yml$)'
          run=true
          from=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            from="$BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            from="$BEFORE_SHA"
          fi
          if [ -n "$from" ]; then
            if changed=$(git diff --name-only "$from" HEAD); then
              if printf '%s\n' "$changed" | grep -E -q "$pattern"; then
                run=true
              else
                run=false
                echo "No iOS-related path changes; skipping generate/build/test."
              fi
            else
              echo "Could not diff against $from; running iOS verification."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate the iOS Xcode project
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: ./scripts/generate-ios.sh

      - name: Build Quota iOS
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: ./scripts/build-ios.sh

      - name: Test Quota iOS
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: ./scripts/test-ios.sh
