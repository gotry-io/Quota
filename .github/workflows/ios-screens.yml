name: ios-screens

# The advisory iOS screen census: one screen or state per test, captured and audited with the
# accessibility auditor. It is deliberately **not** a required check and never runs from
# `merge_group`, so a rendering finding does not hold the merge queue; it still fails visibly, and a
# confirmed finding is a defect to fix. The required journeys are `verify-ios-ui` in ci.yml.
on:
  pull_request:
  schedule:
    # Nightly on main, 03:40 UTC.
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Which profiles to capture"
        default: all
        type: choice
        options: [all, light-large, dark-large, light-accessibility]

permissions:
  contents: read

# Its own namespace: sharing ci's group would let an advisory run cancel a required one.
concurrency:
  group: ios-screens-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.ios.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A scheduled or manual run captures the census whatever moved; a pull request captures it
      # only when something iOS-related did. An unknown base still answers run=true.
      - name: Detect iOS-related path changes
        id: ios
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/ci-changed-paths.sh any \
            '^(apps/ios(/|$)|packages/apple-client(/|$)|packages/apple-shared(/|$)|packages/protocol(/|$)|packages/provider(/|$)|packages/design-tokens(/|$)|scripts/[^/]*ios[^/]*$|scripts/generate-(design-tokens|provider-catalog|plan-display)\.mjs$|scripts/ci-changed-paths\.sh$|\.github/workflows/ios-screens\.yml$)'

  # One macOS job walks the profiles in sequence. A matrix would ask for three macOS runners at
  # once, which is the demand this split exists to reduce.
  screens:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    permissions:
      contents: read
      # Reads this job's own queued and started times, so allocation wait is measured.
      actions: read
    steps:
      # Waiting for a macOS runner and running on one are different costs, and only the second is
      # this workflow's own. The first step marks when execution began; the last reports both.
      - name: Mark the start of execution
        run: echo "SCREENS_EXECUTION_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate the iOS Xcode project
        run: ./scripts/generate-ios.sh

      # Appearance and text size are independent axes; each profile names both, and every launch
      # sets them explicitly rather than inheriting whatever the simulator had.
      - name: Capture and audit the screens
        env:
          PROFILE: ${{ github.event.inputs.profile || 'all' }}
          NIGHTLY: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          run_profile() {
            name="$1"; appearance="$2"; size="$3"
            echo "::group::$name ($appearance, $size)"
            status=0
            QUOTA_IOS_ONLY_TESTING=QuotaUITests/QuotaScreenUITests \
            QUOTA_IOS_SKIP_PACKAGE_TESTS=1 \
            QUOTA_IOS_APPEARANCE="$appearance" \
            QUOTA_IOS_TEXT_SIZE="$size" \
            QUOTA_IOS_RESULT_BUNDLE="dist/ios-screens-$name.xcresult" \
            ./scripts/test-ios.sh || status=$?
            echo "::endgroup::"
            echo "$name $status" >> dist/ios-screens-status
          }
          mkdir -p dist
          : > dist/ios-screens-status
          case "$PROFILE" in
            light-large) run_profile light-large light large ;;
            dark-large) run_profile dark-large dark large ;;
            light-accessibility) run_profile light-accessibility light accessibilityExtraLarge ;;
            *)
              run_profile light-large light large
              run_profile dark-large dark large
              run_profile light-accessibility light accessibilityExtraLarge
              if [ "$NIGHTLY" = "true" ]; then
                run_profile dark-accessibility dark accessibilityExtraLarge
              fi
              ;;
          esac

      # Every profile that ran must have left a bundle, a run that matched the census class, and
      # audit outcomes. A summary or an export that fails is a census without evidence, which is
      # not the same as a census that found nothing.
      - name: Summarize the census
        id: summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p dist/ios-screens-outcomes dist/ios-screens-shots
          problems=0
          while read -r profile _; do
            name="ios-screens-$profile"
            bundle="dist/$name.xcresult"
            if [ ! -d "$bundle" ]; then
              echo "$profile produced no result bundle." | tee -a "$GITHUB_STEP_SUMMARY"
              problems=$((problems + 1))
              continue
            fi
            recovered=$(grep -c "recovered-on-retry:" "dist/$name.log" 2>/dev/null || true)
            {
              echo "### $profile"
              node scripts/ios-ui-run-summary.mjs "$bundle" --title "Screen census" \
                --expect-class QuotaScreenUITests \
                --expect-methods apps/ios/UITests/QuotaScreenUITests.swift --min-tests 30 \
                || echo "EVIDENCE FAILED"
              echo ""
              echo "Interactions recovered on retry: ${recovered:-0}"
              node scripts/ios-ui-audit-summary.mjs "$bundle" \
                --out-dir "dist/ios-screens-outcomes/$name" || echo "EVIDENCE FAILED"
            } | tee "dist/$name.summary" | tee -a "$GITHUB_STEP_SUMMARY"
            if grep -q "EVIDENCE FAILED" "dist/$name.summary"; then
              problems=$((problems + 1))
            fi
            # The pictures are the point of this workflow, so they leave the runner.
            if ! xcrun xcresulttool export attachments --path "$bundle" \
              --output-path "dist/ios-screens-shots/$name" >/dev/null; then
              echo "$profile: attachments could not be exported." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              problems=$((problems + 1))
            fi
          done < dist/ios-screens-status
          echo "evidence-problems=$problems" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots and audit outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screens
          path: |
            dist/ios-screens-shots/
            dist/ios-screens-outcomes/
            dist/ios-screens-status
            dist/ios-screens-*.log
          if-no-files-found: error
          retention-days: 14

      # The audit outcomes again, on their own and small: the trend job reads the last several
      # nights of these, and should not have to download every night's pictures to do it.
      - name: Upload the audit outcomes for the trend gate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screens-outcomes
          path: |
            dist/ios-screens-outcomes/
            dist/ios-screens-status
          if-no-files-found: warn
          retention-days: 14

      # Allocation wait is from the job being queued to a runner starting it (GitHub's own
      # timestamps for this job); execution is from the first step to this one.
      - name: Record allocation wait and execution time
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          now=$(date -u +%s)
          execution=$((now - SCREENS_EXECUTION_STARTED))
          times=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "screens") | "\(.created_at) \(.started_at)"' \
            | head -n 1)
          wait="unknown (the jobs API did not answer)"
          if [ -n "$times" ]; then
            queued=$(date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "${times% *}" +%s)
            started=$(date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "${times#* }" +%s)
            wait="$((started - queued))s"
          fi
          {
            echo "### Runner time"
            echo ""
            echo "- Allocation wait (queued → runner started): $wait"
            echo "- Execution (first step → this step): ${execution}s"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The captures and audits are the point; a profile that failed — or that produced no evidence
      # that it ran at all — keeps this job red without blocking the queue, because this workflow
      # is not a required check.
      - name: Fail if a profile failed
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -s dist/ios-screens-status || { echo "no profile ran"; exit 1; }
          cat dist/ios-screens-status
          if [ "${{ steps.summary.outputs.evidence-problems }}" != "0" ]; then
            echo "A profile left no usable evidence; see the summary above."
            exit 1
          fi
          ! grep -qv " 0$" dist/ios-screens-status

  # An `incomplete` audit — the auditor hit its deadline — never fails a census run, by design: one
  # slow audit is not a finding. A screen whose audit times out every night is therefore never
  # audited and nothing says so. This reads the audit outcomes of the recent nightly runs and
  # reddens itself when a screen has stopped completing. Nightly and manual runs only: a pull
  # request has no window of its own to read. It stores nothing — the artifacts are the history —
  # opens or updates one issue, and blocks no merge, because this workflow is not a required check.
  trend:
    needs: screens
    if: >-
      ${{ always()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # The window is five eligible runs; a few more are listed because a run whose artifact expired
      # or never existed carries no evidence and is then eligible for nothing.
      - name: Download the audit outcomes of the recent nightly runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p runs
          # This run first: a manual run is not a scheduled one, so `gh run list` would not name it,
          # and on the nightly its own artifact is the newest evidence there is.
          {
            gh run view "$RUN_ID" --repo "$REPO" --json databaseId,createdAt \
              --jq '"\(.databaseId) \(.createdAt)"'
            gh run list --repo "$REPO" --workflow ios-screens.yml --event schedule --branch main \
              --limit 8 --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"'
          } | awk '!seen[$1]++' > wanted-runs
          # `</dev/null` so nothing in the loop can consume the run list the loop is reading: a
          # window silently cut to one run would read as "not enough history" and pass.
          while read -r id created; do
            if gh run download "$id" --repo "$REPO" --name ios-screens-outcomes \
              --dir "runs/$id" </dev/null; then
              printf '{"run_id":"%s","created_at":"%s"}\n' "$id" "$created" > "runs/$id/run.json"
            else
              echo "::notice::run $id kept no outcomes artifact; it is eligible for nothing"
              rm -rf "runs/$id"
            fi
          done < wanted-runs

      - name: Judge the trend
        id: trend
        run: |
          set -uo pipefail
          mkdir -p dist
          status=0
          node scripts/ios-audit-trend.mjs --runs-dir runs --n 5 \
            --out dist/ios-audit-trend.json \
            --issue-body dist/ios-audit-trend-issue.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > dist/ios-audit-trend.md || status=$?
          cat dist/ios-audit-trend.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # The step summary is prose; this is the same verdict a reviewer can re-read.
      - name: Upload the trend verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-audit-trend
          path: dist/ios-audit-trend.json
          if-no-files-found: warn
          retention-days: 14

      # One issue, found by its exact title. A gate that opened a new issue every night would be
      # noise, and closing that one issue when the gate clears is the signal that it was fixed.
      - name: Open, update, or close the tracking issue
        if: ${{ steps.trend.outputs.status == '0' || steps.trend.outputs.status == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STATUS: ${{ steps.trend.outputs.status }}
          TITLE: "iOS screens: audits not completing"
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
            --jq 'first(.[] | select(.title == env.TITLE) | .number)')
          if [ "$STATUS" = "1" ] && [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" \
              --body-file dist/ios-audit-trend-issue.md
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file dist/ios-audit-trend-issue.md
            if [ "$STATUS" = "0" ]; then
              gh issue close "$number" --repo "$REPO"
            fi
          fi

      - name: Fail if a screen stopped completing
        if: ${{ steps.trend.outputs.status != '0' }}
        run: |
          echo "The audit trend gate is red; see the summary above and the tracking issue."
          exit 1
