name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0 bun@1.3.10
          node --version
          pnpm --version
          bun --version
          swift --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: |
          pnpm format:check
          pnpm check
          pnpm test
          pnpm build

      - name: Package unsigned arm64 app
        run: ./scripts/package-menubar.sh 0.1.0 "${{ github.run_number }}"
