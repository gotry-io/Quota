name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          node --version
          pnpm --version
          cargo --version
          swift --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: |
          pnpm format:check
          pnpm check
          pnpm test
          pnpm build

      - name: Package unsigned arm64 app
        run: ./scripts/package-menubar.sh 0.0.1 "${{ github.run_number }}"

      - name: Test packaged helper with isolated local state
        run: pnpm test:menubar:helper

  verify-linux-cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test Linux QuotaCLI
        run: |
          cargo check --locked --package quotacli --all-targets
          cargo build --locked --release --package quotacli
          CLI_VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -er \
            '.packages[] | select(.name == "quotacli") | .version')"
          test "$(target/release/quotacli version)" = "QuotaCLI ${CLI_VERSION}"
          cargo test --locked --package quotacli
