name: release-cli

# A cli-v* tag publishes the architecture-neutral Node.js QuotaCLI package only.
# Stable tags (cli-v0.0.2) publish to npm dist-tag "latest".
# Prerelease tags (cli-v0.0.2-beta.1) publish to npm dist-tag "beta".
# Menubar releases use menubar-v* and do not run this workflow.
# npm authenticates this exact workflow through Trusted Publishing (OIDC), so no long-lived npm
# token is stored in GitHub.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing QuotaCLI semver to re-publish (e.g. 0.0.4), without cli-v prefix"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: quotacli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('cli-v{0}', github.event.inputs.version) || github.ref }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" == cli-v* ]]; then
            VERSION="${REF_NAME#cli-v}"
          else
            echo "expected tag cli-v*, got: $REF_NAME" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          # Prerelease versions use a hyphen suffix (semver), e.g. 0.0.2-beta.1.
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL=beta
            NPM_TAG=beta
          else
            CHANNEL=stable
            NPM_TAG=latest
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 pnpm@10.23.0 bun@1.3.10
          node --version
          npm --version
          pnpm --version
          bun --version

      - name: Install and verify
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm check
          pnpm -r --if-present test

      - name: Stamp and inspect package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm pkg set "version=${VERSION}" --prefix apps/cli
          test "$(node -p "require('./apps/cli/package.json').version")" = "$VERSION"
          cd apps/cli
          npm pack --dry-run

      - name: Check registry
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@gotry-io/quotacli@${VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@gotry-io/quotacli@${VERSION} is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish QuotaCLI
        if: steps.registry.outputs.publish == 'true'
        working-directory: apps/cli
        env:
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          echo "Publishing @gotry-io/quotacli as channel=${CHANNEL} tag=${NPM_TAG}"
          npm publish --tag "$NPM_TAG"

      # Stable tags also push Formula/quotacli.rb to gotry-io/homebrew-tap (npm tarball install).
      # Prerelease tags skip Homebrew; use npm @beta instead.
      - name: Publish Homebrew Formula
        if: steps.version.outputs.channel == 'stable'
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$TAP_PUSH_TOKEN"
          # Package must already be on npm (this run or a prior publish).
          if ! npm view "@gotry-io/quotacli@${VERSION}" version >/dev/null 2>&1; then
            echo "@gotry-io/quotacli@${VERSION} is not on npm; cannot render Formula" >&2
            exit 1
          fi
          TARBALL_URL="$(npm view "@gotry-io/quotacli@${VERSION}" dist.tarball)"
          EXPECTED_URL="https://registry.npmjs.org/@gotry-io/quotacli/-/quotacli-${VERSION}.tgz"
          test "$TARBALL_URL" = "$EXPECTED_URL"
          SHA256="$(curl -fsSL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)"
          git clone --depth 1 \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/gotry-io/homebrew-tap.git" \
            "$RUNNER_TEMP/homebrew-tap"
          mkdir -p "$RUNNER_TEMP/homebrew-tap/Formula"
          ./scripts/render-homebrew-formula.sh \
            "$VERSION" "$SHA256" "$RUNNER_TEMP/homebrew-tap/Formula/quotacli.rb"
          cd "$RUNNER_TEMP/homebrew-tap"
          git add Formula/quotacli.rb
          if git diff --cached --quiet; then
            echo "QuotaCLI Formula is already at ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "quotacli ${VERSION}"
          # Cask and Formula may land from concurrent release jobs; rebase before push.
          git pull --rebase origin main
          git push

      - name: Skip Homebrew Formula for prerelease
        if: steps.version.outputs.channel == 'beta'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Skipping Homebrew Formula update for prerelease ${VERSION}"
          echo "Install with: npm install -g @gotry-io/quotacli@beta"
