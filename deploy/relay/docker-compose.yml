# The same topology as portainer-stack.yml for a host run with `docker compose`
# and an env_file: Relay, the Cloudflare Tunnel connector and the backup job on one
# private network, nothing published (ADR 0055).
name: quota-relay

services:
  relay:
    image: ghcr.io/gotry-io/quota-relay:latest
    restart: unless-stopped
    env_file: relay.env
    environment:
      PORT: "8787"
      RELAY_SQLITE_PATH: /data/relay.sqlite
      RELAY_STATIC_DIR: apps/web/.svelte-kit/output/client
      # cloudflared is the only peer on the network and names the client in
      # CF-Connecting-IP, which Cloudflare sets and a client cannot.
      RELAY_CLIENT_ADDRESS_HEADER: cf-connecting-ip
    volumes:
      - relay-data:/data
    networks:
      - quota
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||'8787')+'/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - quota
    depends_on:
      relay:
        condition: service_healthy

  backup:
    image: alpine:3.21
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      RELAY_SQLITE_PATH: /data/relay.sqlite
      RELAY_BACKUP_DIR: /backups
      RELAY_BACKUP_KEEP: "14"
    volumes:
      - relay-data:/data
      - relay-backups:/backups
      - ../../scripts/relay-sqlite-backup.sh:/usr/local/bin/relay-sqlite-backup.sh:ro
    networks:
      - quota
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache sqlite tzdata
        exec /usr/local/bin/relay-sqlite-backup.sh --loop

networks:
  quota:
    name: quota-relay

volumes:
  relay-data:
  relay-backups:
