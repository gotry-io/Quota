name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each queued pull request on top of main and the ones ahead of it, and
  # merges only what passed there, so a pull request no longer has to be re-synced and re-run every
  # time something else lands first.
  merge_group:

permissions:
  contents: read

# A superseded run on a PR branch is cancelled as soon as the next push starts. main does not
# cancel a running commit; a pending main run can still be replaced by a newer one, which is
# GitHub's queueing behaviour and not a promise that every main SHA keeps a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One Ubuntu job decides what the macOS runners have to do. Detecting it inside each macOS job
  # meant allocating a scarce macOS runner and a full-history checkout only to answer "nothing to
  # do"; the selections are the same script, run once, on a runner that is never the bottleneck.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      swift: ${{ steps.swift.outputs.run }}
      ios: ${{ steps.ios.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A change confined to the website, the Relay Worker, relay-core, or documentation reaches
      # no Rust or Swift target, and verify-web already checks it. Anything else, including
      # packages/protocol (Swift and Rust decode its fixtures), scripts, and this file, is Swift work.
      - name: Detect paths that reach Rust or Swift
        id: swift
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: >-
          ./scripts/ci-changed-paths.sh all
          '^(apps/web/|apps/relay/|packages/relay-core/|docs/|[^/]+\.md$|\.github/workflows/(pr-agent|release-ios|release-menubar|release-relay-image)\.yml$)'

      # The iOS app, the Apple packages it embeds, the contracts they decode, the generators that
      # write those contracts, and this file.
      - name: Detect iOS-related path changes
        id: ios
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: >-
          ./scripts/ci-changed-paths.sh any
          '^(apps/ios(/|$)|packages/apple-client(/|$)|packages/apple-shared(/|$)|packages/protocol(/|$)|packages/provider(/|$)|packages/design-tokens(/|$)|scripts/[^/]*ios[^/]*$|scripts/generate-(design-tokens|provider-catalog|plan-display)\.mjs$|scripts/ci-changed-paths\.sh$|\.github/workflows/ci\.yml$)'

  # TypeScript, the provider catalog, and Biome formatting need no macOS toolchain, so they
  # run here and leave `verify` carrying only Swift and macOS-gated Rust.
  # `verify` remains the required macOS check name; keep this job required too.
  verify-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript workspace
        run: |
          set -euo pipefail
          pnpm format:check:js
          pnpm check:provider-catalog
          pnpm check:design-tokens
          pnpm check:plan-display
          pnpm check:adr-index
          pnpm check:reference
          pnpm check:schema
          pnpm -r --if-present check
          pnpm -r --if-present test
          # The scripts that decide what CI runs and what a release tag may name.
          pnpm test:scripts

      - name: Build the Node Relay
        run: pnpm --filter @gotry-io/quota-relay build

      - name: Build the Relay Worker and website
        run: pnpm --filter @gotry-io/quota-relay build:workers

      - name: Run remaining Relay runtime suites
        run: |
          set -euo pipefail
          pnpm --filter @gotry-io/quota-relay test:workers
          pnpm --filter @gotry-io/quota-relay test:node:integration

  verify-web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @gotry-io/quota-web exec playwright install --with-deps chromium

      - name: Run website end-to-end tests
        run: pnpm --filter @gotry-io/quota-web test:e2e

  # A change that reaches no Rust or Swift target answers success without the toolchain; the
  # selection is made once in `changes`.
  verify:
    runs-on: ${{ needs.changes.outputs.swift == 'true' && 'macos-26' || 'ubuntu-24.04' }}
    needs: changes
    steps:
      - uses: actions/checkout@v6

      # A required check that has nothing to do says so, and says it from a runner that is not
      # scarce: this job is on macOS only when Rust or Swift sources changed.
      - name: Say what this run decided
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.outputs.swift }}" = "true" ]; then
            echo "Rust and Swift: running on $RUNNER_OS, attempt ${{ github.run_attempt }}." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Rust and Swift: nothing they depend on changed; answered on $RUNNER_OS." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.changes.outputs.swift == 'true' }}
        with:
          components: rustfmt

      # Only main writes the cache. Feature branches restore from it but never save, which
      # keeps a busy PR queue from evicting main's entry out of the 10 GB repository limit.
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.changes.outputs.swift == 'true' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # quota-service carries `cfg(target_os = "macos")` branches in relay and the Claude
      # provider, so these tests cannot move to a Linux runner.
      # This job runs the root `test` script's Rust and Swift halves without pnpm, because it
      # installs no node. `cargo test` supersedes the `cargo check --all-targets` that root
      # `check` runs first, and the packaging step below links QuotaBar in release, so neither
      # belongs here. rustfmt covers the whole workspace and this is the only Rust runner.
      - name: Verify Rust and Swift
        if: ${{ needs.changes.outputs.swift == 'true' }}
        run: |
          set -euo pipefail
          swift --version
          cargo fmt --all -- --check
          cargo test --locked --package quota-service --package quota-menubar-helper
          ./scripts/test-swift.sh

      - name: Upload Visual QA matrix
        if: ${{ needs.changes.outputs.swift == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: quotabar-visual-matrix
          path: ${{ runner.temp }}/quotabar-screenshots
          if-no-files-found: error
          retention-days: 14

      # QuotaBar.xcodeproj is generated from apps/menubar/project.yml and committed; a source
      # file added without regenerating it would still build under SwiftPM above and only fail
      # here, so the committed project is checked against a fresh generation first.
      - name: Install XcodeGen
        if: ${{ needs.changes.outputs.swift == 'true' }}
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Check the committed QuotaBar project is current
        if: ${{ needs.changes.outputs.swift == 'true' }}
        run: |
          ./scripts/generate-menubar.sh
          git diff --exit-code -- apps/menubar/QuotaBar.xcodeproj

      - name: Package unsigned arm64 app
        if: ${{ needs.changes.outputs.swift == 'true' }}
        run: ./scripts/package-menubar.sh 0.0.1 "${{ github.run_number }}"

      - name: Test packaged helper with isolated local state
        if: ${{ needs.changes.outputs.swift == 'true' }}
        run: ./scripts/test-menubar-helper.sh

  # iOS generate/build/unit tests. A required check: it answers success without the Xcode steps
  # when `changes` says nothing iOS-related moved.
  verify-ios:
    runs-on: ${{ needs.changes.outputs.ios == 'true' && 'macos-26' || 'ubuntu-24.04' }}
    needs: changes
    steps:
      - uses: actions/checkout@v6

      # A required check that has nothing to do says so, and says it from a runner that is not
      # scarce: this job is on macOS only when something the iOS unit tests cover changed.
      - name: Say what this run decided
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.outputs.ios }}" = "true" ]; then
            echo "iOS unit tests: running on $RUNNER_OS, attempt ${{ github.run_attempt }}." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "iOS unit tests: nothing they depend on changed; answered on $RUNNER_OS." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v6
        if: ${{ needs.changes.outputs.ios == 'true' }}
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install XcodeGen
        if: ${{ needs.changes.outputs.ios == 'true' }}
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # The generated project is committed; a project.yml edit that was not regenerated fails
      # here rather than shipping a project that disagrees with its source, as QuotaBar's does.
      - name: Generate the iOS Xcode project
        if: ${{ needs.changes.outputs.ios == 'true' }}
        run: |
          set -euo pipefail
          ./scripts/generate-ios.sh
          git diff --exit-code -- apps/ios/Quota.xcodeproj

      # `xcodebuild test` builds the app and the test bundles itself; a separate build step
      # first was the same simulator build twice. `pnpm build:ios` remains for a local check.
      - name: Test Quota iOS
        if: ${{ needs.changes.outputs.ios == 'true' }}
        run: >
          QUOTA_IOS_ONLY_TESTING=QuotaTests
          QUOTA_IOS_SKIP_PACKAGE_TESTS=1
          QUOTA_IOS_RESULT_BUNDLE=dist/ios-unit.xcresult
          ./scripts/test-ios.sh

      # The same contract as the journeys: a selection that matched nothing is not a pass, and the
      # count is on the record so a shrinking suite is visible rather than quietly green.
      - name: Summarize the unit run
        if: ${{ always() && needs.changes.outputs.ios == 'true' }}
        run: |
          set -euo pipefail
          if [ ! -d dist/ios-unit.xcresult ]; then
            echo "No dist/ios-unit.xcresult; the unit run produced no result bundle." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/ios-ui-run-summary.mjs dist/ios-unit.xcresult \
            --title "iOS unit run" --min-tests 200 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The failed attempt's own evidence, kept rather than re-derived from a rerun that passed.
      - name: Upload the unit result bundle
        if: ${{ failure() && needs.changes.outputs.ios == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-xcresult-attempt-${{ github.run_attempt }}
          path: dist/ios-unit.xcresult
          if-no-files-found: warn
          retention-days: 5

  # The required iOS UI gate is QuotaSmokeUITests: fixture-backed journeys and interaction
  # contracts, no accessibility audit and no screen census. The census is QuotaScreenUITests in
  # .github/workflows/ios-screens.yml, which is advisory and does not hold the merge queue.
  # Same path gate as verify-ios.
  verify-ios-ui:
    runs-on: ${{ needs.changes.outputs.ios == 'true' && 'macos-26' || 'ubuntu-24.04' }}
    needs: changes
    steps:
      - uses: actions/checkout@v6

      # A required check that has nothing to do says so, and says it from a runner that is not
      # scarce: this job is on macOS only when something the iOS journeys cover changed.
      - name: Say what this run decided
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.outputs.ios }}" = "true" ]; then
            echo "iOS journeys: running on $RUNNER_OS, attempt ${{ github.run_attempt }}." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "iOS journeys: nothing they depend on changed; answered on $RUNNER_OS." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v6
        if: ${{ needs.changes.outputs.ios == 'true' }}
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install XcodeGen
        if: ${{ needs.changes.outputs.ios == 'true' }}
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate the iOS Xcode project
        if: ${{ needs.changes.outputs.ios == 'true' }}
        run: ./scripts/generate-ios.sh

      - name: Test Quota iOS UI journeys
        if: ${{ needs.changes.outputs.ios == 'true' }}
        run: >
          QUOTA_IOS_ONLY_TESTING=QuotaUITests/QuotaSmokeUITests
          QUOTA_IOS_SKIP_PACKAGE_TESTS=1
          QUOTA_IOS_RESULT_BUNDLE=dist/ios-smoke.xcresult
          ./scripts/test-ios.sh

      # A journey failure needs the frames and hierarchy of the attempt that failed, and the
      # selection itself is a contract: an empty or misspelled selection must not read as green.
      - name: Summarize the journey run
        if: ${{ always() && needs.changes.outputs.ios == 'true' }}
        run: |
          set -euo pipefail
          if [ ! -d dist/ios-smoke.xcresult ]; then
            echo "No dist/ios-smoke.xcresult; the journey run produced no result bundle." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/ios-ui-run-summary.mjs dist/ios-smoke.xcresult --expect-class QuotaSmokeUITests --min-tests 10 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the journey result bundle
        if: ${{ failure() && needs.changes.outputs.ios == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-xcresult-attempt-${{ github.run_attempt }}
          path: dist/ios-smoke.xcresult
          if-no-files-found: warn
          retention-days: 5
