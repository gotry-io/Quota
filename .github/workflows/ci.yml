name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run on a PR branch is cancelled as soon as the next push starts.
# main never cancels: every commit on it keeps a complete, attributable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # TypeScript, the provider catalog, and Biome formatting need no macOS toolchain, so they
  # run here and leave `verify` carrying only Swift and macOS-gated Rust.
  # `verify` remains the required macOS check name; keep this job required too.
  verify-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript workspace
        run: |
          set -euo pipefail
          pnpm format:check:js
          pnpm check:provider-catalog
          pnpm check:schema
          pnpm -r --if-present check
          pnpm -r --if-present test

      - name: Build the Relay Worker and website
        run: pnpm --filter @gotry-io/quota-relay build

  verify-web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned toolchain packages
        run: |
          set -euo pipefail
          npm install --global pnpm@10.23.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @gotry-io/quota-web exec playwright install --with-deps chromium

      - name: Run website end-to-end tests
        run: pnpm --filter @gotry-io/quota-web test:e2e

  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A change confined to the website, the Relay Worker, relay-core, or documentation reaches
      # no Rust or Swift target, and verify-web already checks it; this job then answers
      # success without the toolchain. Anything else, including packages/protocol (Swift and Rust
      # decode its fixtures), scripts, and this file, runs the whole job.
      - name: Detect paths that reach Rust or Swift
        id: mac
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          ./scripts/ci-changed-paths.sh all
          '^(apps/web/|apps/relay/|packages/relay-core/|docs/|[^/]+\.md$|\.github/workflows/(deploy-cloudflare|pr-agent|release-ios|release-menubar)\.yml$)'

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.mac.outputs.run == 'true' }}
        with:
          components: rustfmt

      # Only main writes the cache. Feature branches restore from it but never save, which
      # keeps a busy PR queue from evicting main's entry out of the 10 GB repository limit.
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.mac.outputs.run == 'true' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # quota-service carries `cfg(target_os = "macos")` branches in relay and the Claude
      # provider, so these tests cannot move to a Linux runner.
      # This job runs the root `test` script's Rust and Swift halves without pnpm, because it
      # installs no node. `cargo test` supersedes the `cargo check --all-targets` that root
      # `check` runs first, and the packaging step below links QuotaBar in release, so neither
      # belongs here. rustfmt covers the whole workspace and this is the only Rust runner.
      - name: Verify Rust and Swift
        if: ${{ steps.mac.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          swift --version
          cargo fmt --all -- --check
          cargo test --locked --package quota-service --package quota-menubar-helper
          ./scripts/test-swift.sh

      # QuotaBar.xcodeproj is generated from apps/menubar/project.yml and committed; a source
      # file added without regenerating it would still build under SwiftPM above and only fail
      # here, so the committed project is checked against a fresh generation first.
      - name: Install XcodeGen
        if: ${{ steps.mac.outputs.run == 'true' }}
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Check the committed QuotaBar project is current
        if: ${{ steps.mac.outputs.run == 'true' }}
        run: |
          ./scripts/generate-menubar.sh
          git diff --exit-code -- apps/menubar/QuotaBar.xcodeproj

      - name: Package unsigned arm64 app
        if: ${{ steps.mac.outputs.run == 'true' }}
        run: ./scripts/package-menubar.sh 0.0.1 "${{ github.run_number }}"

      - name: Test packaged helper with isolated local state
        if: ${{ steps.mac.outputs.run == 'true' }}
        run: ./scripts/test-menubar-helper.sh

  # iOS generate/build/test. Advisory: not a required check. The Xcode steps run
  # only when the pull request or push touches iOS-related paths.
  verify-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect iOS-related path changes
        id: ios
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          ./scripts/ci-changed-paths.sh any
          '^(apps/ios(/|$)|packages/apple-client(/|$)|packages/apple-shared(/|$)|scripts/[^/]*ios[^/]*$|scripts/ci-changed-paths\.sh$|\.github/workflows/ci\.yml$)'

      - name: Install XcodeGen
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate the iOS Xcode project
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: ./scripts/generate-ios.sh

      - name: Build Quota iOS
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: ./scripts/build-ios.sh

      - name: Test Quota iOS
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: QUOTA_IOS_ONLY_TESTING=QuotaTests ./scripts/test-ios.sh

  # The 29 UI tests launch the app, load a fixture, and run the accessibility audit one screen
  # at a time, which is most of an iOS run; they get their own runner so a unit failure is
  # known in minutes and the two halves finish side by side. Same path gate as verify-ios.
  verify-ios-ui:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect iOS-related path changes
        id: ios
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          ./scripts/ci-changed-paths.sh any
          '^(apps/ios(/|$)|packages/apple-client(/|$)|packages/apple-shared(/|$)|scripts/[^/]*ios[^/]*$|scripts/ci-changed-paths\.sh$|\.github/workflows/ci\.yml$)'

      - name: Install XcodeGen
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate the iOS Xcode project
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: ./scripts/generate-ios.sh

      - name: Build Quota iOS
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: ./scripts/build-ios.sh

      - name: Test Quota iOS UI
        if: ${{ steps.ios.outputs.run == 'true' }}
        run: QUOTA_IOS_ONLY_TESTING=QuotaUITests ./scripts/test-ios.sh
