services:
  relay:
    build:
      context: ..
      dockerfile: apps/relay/Dockerfile
    environment:
      QUOTA_RELAY_INSTANCE_ID: "${QUOTA_RELAY_INSTANCE_ID:-self-hosted-primary}"
      QUOTA_RELAY_OWNER_TOKEN: "${QUOTA_RELAY_OWNER_TOKEN:?QUOTA_RELAY_OWNER_TOKEN must be set}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - quota-relay-data:/var/lib/quota
    restart: unless-stopped

volumes:
  quota-relay-data:
